<script>
(function() {
  var audio = document.getElementById('bg-music');
  if (!audio) return;
  audio.volume = 0.8;

  function tryPlay() {
    if (audio.paused) {
      var p = audio.play();
      if (p !== undefined) {
        p.then(function() {
          console.log('[Take Me To Your Heart] Playing smoothly!');
        }).catch(function(err) {
          console.log('[Take Me To Your Heart] Autoplay waiting for user click:', err.message);
        });
      }
    }
  }

  // Auto attempt play immediately and on any user action
  tryPlay();
  window.addEventListener('click', tryPlay, { passive: true });
  window.addEventListener('touchstart', tryPlay, { passive: true });
  window.addEventListener('pointerdown', tryPlay, { passive: true });

  // Audio controller
  window.__audioController = {
    play: tryPlay,
    pause: function() { audio.pause(); },
    toggle: function() {
      if (audio.paused) {
        tryPlay();
      } else {
        audio.pause();
      }
    },
    setMuted: function(m) {
      audio.muted = !!m;
    },
    setVolume: function(v) {
      audio.volume = Math.max(0, Math.min(1, v));
    }
  };

  // Sync with music buttons
  document.addEventListener('click', function(e) {

          btn.setAttribute('aria-label', 'Tắt nhạc');

      }, 50);
    }
  });
